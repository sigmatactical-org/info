[package]

name = "sigma-info"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
authors = ["Sigma Tactical Group contributors <https://github.com/sigmatactical-org>"]
homepage = "https://sigmatactical.info"
description = "Markdown-fed information sharing site for Sigma Tactical Group"
publish = false

[dependencies]
askama = "0.16.0"
sigma-config = { git = "https://github.com/sigmatactical-org/config.git", rev = "e66ad4ed16f248b7235c149bec8bba279c7414d2" }
sigma-theme = { git = "https://github.com/sigmatactical-org/sigma-theme.git", rev = "1b5254c46e3b6e5f271116fc61f746ca9f180612", default-features = false, features = ["askama", "warp", "cache", "content"] }
sigma-pg = { git = "https://github.com/sigmatactical-org/sigma-pg.git", rev = "2b20d1d5d5daab1771fce238946037fdde43c907" }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
warp = { version = "0.4.3", features = ["server", "test"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
